<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8f6">
<title>Criare Colchões | Vitrine e ofertas da semana</title>
<meta name="description" content="Colchões, camas box, baús, cabeceiras e jogos de cama da Criare Colchões, em Blumenau. Veja os destaques da semana e peça pelo WhatsApp.">
<link rel="icon" href="assets/logo-criare.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css?v=3">
</head>
<body>

<div class="pagina">
  <!-- 1. Marca e atendimento rápido -->
  <header class="perfil">
    <img class="avatar" src="assets/logo-criare.svg" alt="" width="96" height="96">
    <h1>Criare Colchões</h1>
    <a id="usuario" class="usuario" target="_blank" rel="noopener"></a>
    <p id="bio" class="bio"></p>
    <a id="whats-topo" class="botao botao-whats" data-wa>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><use href="#i-whats"/></svg>
      Falar no WhatsApp
    </a>
  </header>

  <main>
    <!-- 2. Banners em destaque -->
    <section class="banners" aria-roledescription="carrossel" aria-label="Destaques">
      <div id="trilho" class="trilho"></div>
      <div id="pontos" class="pontos"></div>
    </section>

    <!-- 3. Catálogos -->
    <section aria-labelledby="t-catalogos">
      <h2 id="t-catalogos" class="titulo">Catálogos</h2>
      <ul id="catalogos" class="catalogos"></ul>
    </section>

    <!-- 4. Vitrine -->
    <section id="destaques" aria-labelledby="t-destaques">
      <div class="titulo-linha">
        <h2 id="t-destaques" class="titulo">Destaques da semana</h2>
        <p id="validade" class="validade"></p>
      </div>
      <ul id="vitrine" class="grade"></ul>
    </section>
  </main>

  <!-- 5. Rodapé -->
  <footer class="rodape">
    <nav class="redes" aria-label="Contatos">
      <a id="r-instagram" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></a>
      <a data-wa aria-label="WhatsApp"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><use href="#i-whats"/></svg></a>
      <a id="r-telefone" aria-label="Ligar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>
      <a id="r-mapa" target="_blank" rel="noopener" aria-label="Como chegar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></a>
    </nav>
    <address id="endereco"></address>
    <p class="politica">Preços e estoque sujeitos a alteração sem aviso. Fotos dos produtos da loja; cores podem variar conforme a tela.</p>
    <p class="politica">© 2026 Criare Colchões. Todos os direitos reservados.</p>
  </footer>
</div>

<!-- Botão fixo: aparece quando o botão do topo sai da tela -->
<a id="whats-fixo" class="whats-fixo" data-wa aria-hidden="true" tabindex="-1">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><use href="#i-whats"/></svg>
  Falar no WhatsApp
</a>

<!-- Catálogo aberto em tela cheia -->
<dialog id="folha" class="folha" aria-labelledby="folha-titulo">
  <div class="folha-topo">
    <button type="button" id="fechar" class="fechar" aria-label="Voltar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div>
      <h2 id="folha-titulo"></h2>
      <p id="folha-qtd"></p>
    </div>
  </div>
  <ul id="folha-grade" class="grade"></ul>
</dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-whats" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></symbol>
</svg>

<script src="produtos.js?v=3"></script>
<script src="minisite.js?v=3"></script>
</body>
</html>
